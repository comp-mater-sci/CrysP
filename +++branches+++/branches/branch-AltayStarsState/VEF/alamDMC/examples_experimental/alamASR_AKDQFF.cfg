AKDQFF_ASR           # Prefix for output   
T                    # Request incremental output of the material state
1                    # Verbosity level
1                    # Type of input texture (1 - SMT, 2 - CUR, 3 - CUB)
AKDQFF.SMT           # Name of texture file
0                    # Simulation type: 0 - Alamel, 1 - FC-Taylor
bcc.pre              # Definition of slip systems (filename)
micro1.smt           # Microstructure definition (filename)
T                    # Read other microstructural parameters
1.0  0.0  0.0        # F_mic tensor - 1st line: components F(*,1)
0.0  1.0  0.3        # F_mic tensor - 2nd line: components F(*,2)
0.5  0.4  1.0        # F_mic tensor - 3rd line: components F(*,3)
0                    # Hardening law Id
5.e-1  T             # Jacobi_eps, Flag: linearize
1e-5   1e-3          # Default eps for TR-solver, eps for the norm of objective function: ||F||_2
0.0  0.0  0.0        # Rotation angles to be preimposed
stress.dat           # Definition of stress steps
T                    # Flag: Incrementally update the texture
0  0.2  0.05         # Type of scaling, Norm of total strain  and  strain increment per step
