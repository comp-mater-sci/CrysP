DC06F250_QRS_state     # Prefix for the output files
F                    # Request incremental output of the material state
1                    # Verbosity level
1                    # Type of input texture (1 - SMT, 2 - CUR, 3 - CUB)
../DC06F250.SMT      # For SMT and CUB: Name_of_texure_file; for CUR: blockId  name_of_texture_file
0                    # Simulation type: 0 - Alamel, 1 - FC-Taylor
../bccbp.pre         # Definition of slip systems (filename)
../micro1.smt        # Microstructure definition (filename)
F                    # Read other microstructural parameters
11                   # Hardening law Hid; 
PAR11.par            # For Hid=0: no line; For Hid=1: 5 Voce parameters; For Hid = 11: name of parameter file; 
3     DC06F250_UDSA.BPM # For Hid=0&1: no line; For Hid = 11: state block id; state file
5.e-1  T             # Jacobi_eps,  linearize
1e-5   1e-3          # Default eps for TR-solver, eps for the norm of objective function: ||F||_2
uniform              # Range type specification. This can be one of these: uniform, biased, doublebiased, multibiased  
0.0   180.0  15.0    # Range specification for 'uniform':  begin  end  step 
0.0                  # stress ratio:  rho 
F                    # Flag: request calculations of Taylor factor (increases calculation time)
F  F                 # Flags: reuse_previous   reuse_stainrate
T                    # Flag: use symmetry folding
