DC06F250_UDSA        # Prefix for the output files
T                    # Request incremental output of the material state
1                    # Verbosity level
1                    # Type of input texture (1 - SMT, 2 - CUR, 3 - CUB)
../DC06F250.SMT      # For SMT and CUB: Name_of_texure_file; for CUR: blockId  name_of_texture_file
0                    # Simulation type: 0 - Alamel, 1 - FC-Taylor
../bccbp.pre         # Definition of slip systems (filename)
../micro1.smt        # Microstructure definition (filename)
11                   # Hardening law Hid; 
PAR11.par            # For Hid=0: no line; For Hid=1: 5 Voce parameters; For Hid = 11: name of parameter file; 
-1    PEBP_state.BPM # For Hid=0&1: no line; For Hid = 11: state block id; state file
5.e-1  T             # Jacobi_eps,  linearize
1e-5   1e-3          # Default eps for TR-solver, eps for the norm of objective function: ||F||_2
0.0                  # Angle to RD (given in degrees)
1  0.3  0.05         # Type of scaling: (0 - full tensor, 1 - only eps_11 component), Norm of the scaled strain  and the scaled strain increment per step 
1.0                  # Uniaxial stress state: use a negative value for compressive state or a positive values for tensile state.
0.0                  # Stress ratio: rho = St22/St11
