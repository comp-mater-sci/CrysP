ifort:
  image: intel/oneapi-hpckit:devel-ubuntu22.04
  script: |
    apt-get update
    apt-get install -y \
    python3-pip
    pip install pandas pytest numpy
    export PATH=${PATH}:${PWD}/VEF/bin
    AR=xiar ./build.sh -c ifort -b debug
    AR=xiar ./build.sh -c ifort -b release -t
    cd test
    pytest --update=logout -v -k fcc12 -k bcc24

