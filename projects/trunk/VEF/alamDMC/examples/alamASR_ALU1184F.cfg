ALU1184F.SMT         # Name of texture file
0                    # Simulation type: 0 - Alamel, 1 - FC-Taylor
fcc.pre              # Definition of slip systems (filename)
micro1.smt           # Microstructure definition (filename)
F                    # Read other microstructural parameters
0                    # Hardening law Id
5.e-1  T             # Jacobi_eps, Flag: linearize
1e-5   1e-3          # Default eps for TR-solver, eps for the norm of objective function: ||F||_2
0.0  0.0  0.0        # Rotation angles to be preimposed
stress.dat           # Definition of stress steps
T                    # Flag: Incrementally update the texture
0  0.2  0.05         # Type of scaling, Norm of total strain  and  strain increment per step
